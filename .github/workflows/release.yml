name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: php-actions/composer@v6
        with:
          # Lowest supported PHP version
          php_version: "7.4"
      - run: composer run package
      - name: Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_COMPRESS: zip
          GHR_PATH: releases/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach SBOM
        run: |
          composer global config --no-plugins allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer global require --no-interaction cyclonedx/cyclonedx-php-composer
          composer CycloneDX:make-sbom --omit=dev --output-format=JSON --output-file=cyclonedx.json
          gh release upload "$GITHUB_REF_NAME" cyclonedx.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
